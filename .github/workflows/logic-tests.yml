name: Biome generation and finder checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stage-9-biomes, stage-10-biome-finder-update]

jobs:
  biomes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Stage 9 biome tests
        run: node tests/biomes.test.mjs
      - name: Check game and biome finder JavaScript syntax
        run: node --check js/main.js && node --check js/biome-finder.js
