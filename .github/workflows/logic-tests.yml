name: Game logic tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stage-9-biomes]

jobs:
  biomes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Stage 9 biome tests
        run: node tests/biomes.test.mjs

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game mode integration tests
        run: node tests/mode.test.mjs
