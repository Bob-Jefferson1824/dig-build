name: Game logic tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stage-9-biomes]

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run world and inventory tests
        run: node tests/logic.test.mjs
      - name: Run game mode integration tests
        run: node tests/mode.test.mjs
