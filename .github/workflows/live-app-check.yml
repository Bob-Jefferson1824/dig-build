name: Live app syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  live-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live browser module syntax
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("index.html","utf8"); const match=html.match(/<script type="module">([\s\S]*?)<\/script>/); if(!match) throw new Error("Live module script not found"); if(!match[1].includes("function survivalTick") || !match[1].includes("function respawnPlayer") || !match[1].includes("health,hunger")) throw new Error("Survival systems missing from live app"); fs.writeFileSync("/tmp/dig-build-live.mjs",match[1]);'
          node --check /tmp/dig-build-live.mjs
