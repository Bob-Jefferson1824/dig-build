name: Biome Finder Tests
on:
  push:
    branches: [main, stage-10-biome-finder]
  pull_request:
    branches: [main]
jobs:
  biome-finder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/biome-finder.test.mjs
